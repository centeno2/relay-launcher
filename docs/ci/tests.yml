name: Desktop checks
on:
  push:
    branches: [main, develop, 'feature/**', 'fix/**']
  pull_request:
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.12', '3.14']
    runs-on: ${{ matrix.os }}
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Install Qt system libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon0
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - name: Check interface at 150 percent scaling
        env:
          QT_SCALE_FACTOR: '1.5'
        run: python -m unittest discover -s tests -p test_ui_layout.py -v
      - name: Check shell syntax
        if: runner.os == 'Linux'
        run: bash -n iniciar.sh instalar.sh desarrollo.sh
